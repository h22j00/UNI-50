<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UNI+ 50일 기도</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="stars"></div>

<!-- 로딩 -->
<div id="loading-screen">
  <div class="loading-cross">✝</div>
  <p>불러오는 중...</p>
</div>

<!-- 사이드바 -->
<nav id="sidebar" style="display:none">
  <div class="sidebar-title">기도</div>

  <!-- 검색 -->
  <div class="search-wrap">
    <input type="text" id="search-input" placeholder="🔍 이름 검색" oninput="filterPersons(this.value)">
  </div>

  <!-- 전체보기 버튼 -->
  <button class="all-view-btn" id="all-view-btn" onclick="openAllView()">
    <span>📋</span>
    <span class="all-view-label">전체 보기</span>
  </button>

  <div id="person-list"></div>
  <button class="add-person-btn" onclick="openAddPersonModal()" title="사람 추가">＋</button>
</nav>

<!-- 메인 -->
<main id="main" style="display:none">
  <div class="empty-state" id="empty-state">
    <div class="cross">✝</div>
    <h2>기도할 사람을<br>선택해주세요</h2>
  </div>

  <!-- 개인 패널 -->
  <div id="person-panel" style="display:none; flex-direction:column; gap:24px; width:100%; max-width:600px;">
    <div class="panel-header">
      <div class="panel-avatar-lg" id="panel-avatar"></div>
      <div class="panel-info">
        <div style="display:flex;align-items:center;gap:10px;">
          <h1 id="panel-name"></h1>
          <button class="btn btn-edit" style="padding:4px 10px;font-size:11px;" onclick="openEditPersonModal()">✏️ 편집</button>
        </div>
        <p id="panel-sub">기도 카드</p>
        <span class="glow-badge" id="glow-badge" style="display:none">✦ 이번 주 기도함</span>
      </div>
    </div>
    <div class="cards-section">
      <h3>📜 기도 카드</h3>
      <div id="cards-container"></div>
    </div>
    <div class="action-row">
      <button class="btn btn-primary" onclick="openWriteModal()">✦ 새 기도문 작성</button>
    </div>
  </div>

  <!-- 전체 보기 패널 -->
  <div id="all-panel" style="display:none; flex-direction:column; gap:24px; width:100%; max-width:640px;">
    <div class="panel-header">
      <div class="panel-info">
        <h1 style="font-family:'Noto Serif KR',serif;font-size:20px;">📋 전체 기도 보기</h1>
        <p style="font-size:12px;color:var(--text-muted);margin-top:4px;">모든 기도문 · 최신순</p>
      </div>
    </div>
    <div id="all-cards-container"></div>
  </div>
</main>

<!-- 기도문 작성/수정 모달 -->
<div class="modal-overlay" id="write-modal">
  <div class="modal">
    <h2 id="modal-title">✦ 새 기도문 작성</h2>
    <div class="form-group">
      <label>기도문</label>
      <textarea id="prayer-text" placeholder="이 분을 위한 기도문을 작성해 주세요..."></textarea>
    </div>
    <div class="modal-actions">
      <button class="btn btn-outline" onclick="closeWriteModal()">취소</button>
      <button class="btn btn-primary" onclick="savePrayer()">저장</button>
    </div>
  </div>
</div>

<!-- 댓글 모달 -->
<div class="modal-overlay" id="comment-modal">
  <div class="modal">
    <h2>💬 댓글</h2>
    <div id="comment-list" style="max-height:260px;overflow-y:auto;margin-bottom:16px;display:flex;flex-direction:column;gap:10px;"></div>
    <div class="form-group" style="margin-bottom:10px;">
      <input type="text" id="comment-author" placeholder="이름">
    </div>
    <div class="form-group">
      <textarea id="comment-text" placeholder="댓글을 입력하세요..." style="min-height:80px;"></textarea>
    </div>
    <div class="modal-actions">
      <button class="btn btn-outline" onclick="closeCommentModal()">닫기</button>
      <button class="btn btn-primary" onclick="saveComment()">등록</button>
    </div>
  </div>
</div>

<!-- 사람 추가/수정 모달 -->
<div class="modal-overlay" id="add-person-modal">
  <div class="modal">
    <h2 id="add-person-title">＋ 새 사람 추가</h2>
    <div class="form-group">
      <label>이름</label>
      <input type="text" id="new-person-name" placeholder="이름을 입력하세요">
    </div>
    <div class="form-group">
      <label>아이콘 선택</label>
      <div class="emoji-picker" id="emoji-picker"></div>
    </div>
    <div class="modal-actions">
      <button class="btn btn-outline" onclick="closeAddPersonModal()">취소</button>
      <button class="btn btn-primary" id="add-person-save-btn" onclick="savePerson()">추가</button>
    </div>
  </div>
</div>

<script type="module" src="app.js"></script>
</body>
</html>
