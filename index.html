<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>POD UNI+ 50일 기도문</title>
<link rel="stylesheet" href="style.css">

<!-- ✨ PWA 추가 -->
<link rel="manifest" href="/UNI-50/manifest.json">
<meta name="theme-color" content="#4692f2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="UNI+ 기도">
<link rel="apple-touch-icon" href="/icon-192.png">
</head>
<body>
<div id="stars"></div>

<!-- 로딩 -->
<div id="loading-screen">
  <div class="loading-cross">🌊</div>
  <p>불러오는 중...</p>
</div>

<!-- 사이드바 -->
<nav id="sidebar" style="display:none">
  <div class="sidebar-title">기도</div>
  <div class="search-wrap">
    <input type="text" id="search-input" placeholder="🔍 이름 검색" oninput="filterPersons(this.value)">
  </div>
  <button class="all-view-btn" id="ddosimi-btn" onclick="openDdosimiView()">
    <span>💕</span>
    <span class="all-view-label">또심이</span>
  </button>
  <button class="all-view-btn" id="all-view-btn" onclick="openAllView()">
    <span>📋</span>
    <span class="all-view-label">전체 기도문</span>
  </button>
  <div id="person-list"></div>
  <button class="add-person-btn" onclick="openAddPersonModal()" title="사람 추가">＋</button>
</nav>

<!-- 메인 -->
<main id="main" style="display:none">
  <div class="empty-state" id="empty-state">
    <div class="uni-logo">

    <h2>본인 이름을 누르고<br>기도문을 적어주세요</h2>
  </div>

  <!-- 개인 패널 -->
  <div id="person-panel" style="display:none; flex-direction:column; gap:24px; width:100%; max-width:860px; padding-bottom:20px;">
    <div class="panel-header">
      <div class="panel-avatar-lg" id="panel-avatar"></div>
      <div class="panel-info">
        <div class="panel-name-row">
          <h1 id="panel-name"></h1>
          <button class="btn btn-edit" style="padding:4px 10px;font-size:11px;flex-shrink:0;" onclick="openEditPersonModal()">✏️ 편집</button>
        </div>
        <p id="panel-sub">기도 카드</p>
        <span class="pledge-badge" id="pledge-badge" style="display:none"></span>
        <span class="glow-badge" id="glow-badge" style="display:none">✦ 이번 주 기도함</span>
      </div>
    </div>
    <div class="cards-section">
      <h3>📜 기도 카드</h3>
      <div id="cards-container"></div>
    </div>
    <div class="action-row">
      <button class="btn btn-primary" onclick="openWriteModal()">✦ 새 기도문 작성</button>
    </div>
  </div>

  <!-- 전체 보기 패널 -->
  <div id="all-panel" style="display:none; flex-direction:column; gap:24px; width:100%; max-width:860px; padding-bottom:20px;">
    <div class="panel-header">
      <div class="panel-info">
        <h1 style="font-family:'Noto Serif KR',serif;font-size:20px;">📋 전체 기도 보기</h1>
        <p style="font-size:12px;color:var(--text-muted);margin-top:4px;">모든 기도문 · 최신순</p>
      </div>
    </div>
    <div id="all-cards-container"></div>
  </div>

  <!-- 또심이 패널 -->
  <div id="ddosimi-panel" style="display:none; flex-direction:column; gap:24px; width:100%; max-width:860px; padding-bottom:20px;">
    <div class="panel-header">
      <div class="panel-info">
        <h1 style="font-family:'Noto Serif KR',serif;font-size:20px;">💕 또 하나의 심장을<br>찾아서</h1>
        <p style="font-size:12px;color:var(--text-muted);margin-top:4px;">또심이를 위해 함께 기도해요</p>
      </div>
    </div>
    <div id="ddosimi-cards-container"></div>
    <button class="btn btn-primary" onclick="openDdosimiAddModal()" style="align-self:flex-start;">♥ 또심이 추가하기</button>
  </div>
</main>

<!-- 댓글 바텀시트 backdrop -->
<div id="sheet-backdrop" onclick="closeCommentSheet()"></div>

<!-- 댓글 바텀시트 -->
<div id="comment-sheet">
  <div class="sheet-handle-bar"></div>
  <div class="sheet-header">
    <span class="sheet-title">💬 댓글</span>
    <button class="sheet-close-btn" onclick="closeCommentSheet()">✕</button>
  </div>
  <div id="sheet-comment-list" class="sheet-comment-list"></div>
  <div class="sheet-input-area">
    <input type="text" id="sheet-comment-author" class="sheet-input-name" placeholder="이름 (빈칸=익명)" maxlength="20">
    <div class="sheet-input-row">
      <textarea id="sheet-comment-text" class="sheet-input-text" placeholder="댓글을 입력하세요..." rows="2"></textarea>
      <button id="sheet-save-btn" class="sheet-send-btn" onclick="saveSheetComment()">↑</button>
    </div>
  </div>
</div>

<!-- 기도문 상세 모달 -->
<div class="modal-overlay" id="detail-modal">
  <div class="modal detail-modal-inner">
    <button class="detail-close-btn" onclick="closeDetailModal()">✕</button>
    <div id="detail-person-header"></div>
    <div id="detail-text" class="detail-text"></div>
    <div class="detail-actions">
      <button class="heart-btn" id="detail-heart-btn" onclick="detailToggleLike()">🤍 <span>0</span></button>
      <button class="comment-bubble-btn" id="detail-comment-btn"
        onmousedown="startCommentHold(event,detailPrayerPersonId,detailPrayerId)"
        onmouseup="cancelCommentHold()" onmouseleave="cancelCommentHold()"
        ontouchstart="startCommentHold(event,detailPrayerPersonId,detailPrayerId)"
        ontouchend="cancelCommentHold()">
        💬 <span class="comment-count">0</span>
      </button>
    </div>
    <div id="detail-edit-btns"></div>
  </div>
</div>

<!-- 기도문 작성/수정 모달 -->
<div class="modal-overlay" id="write-modal">
  <div class="modal">
    <h2 id="modal-title">✦ 새 기도문 작성</h2>
    <div class="form-group">
      <label>제목</label>
      <input type="text" id="prayer-title" placeholder="기도문 제목을 입력하세요" maxlength="40">
    </div>
    <div class="form-group">
      <label>기도문</label>
      <textarea id="prayer-text" placeholder="50일 &lt;UNI+ 부흥&gt; 기도회를 위한 기도문을 작성해주세요!"></textarea>
    </div>
    <div class="modal-actions">
      <button class="btn btn-outline" onclick="closeWriteModal()">취소</button>
      <button class="btn btn-primary" onclick="savePrayer()">저장</button>
    </div>
  </div>
</div>

<!-- 댓글 수정 모달 -->
<div class="modal-overlay" id="edit-comment-modal">
  <div class="modal">
    <h2>✏️ 댓글 수정</h2>
    <div class="form-group">
      <label>이름</label>
      <input type="text" id="edit-comment-author" placeholder="이름 (빈칸이면 익명)" maxlength="20">
    </div>
    <div class="form-group">
      <label>댓글</label>
      <textarea id="edit-comment-text" placeholder="수정할 댓글 내용..." style="min-height:100px;"></textarea>
    </div>
    <div class="modal-actions">
      <button class="btn btn-outline" onclick="closeEditCommentModal()">취소</button>
      <button class="btn btn-primary" onclick="saveEditComment()">저장</button>
    </div>
  </div>
</div>

<!-- 또심이 추가/수정 모달 -->
<div class="modal-overlay" id="ddosimi-modal">
  <div class="modal">
    <h2 id="ddosimi-modal-title">💕 새 또심이 추가</h2>
    <div style="display:flex;gap:12px;">
      <div class="form-group" style="flex:1;">
        <label>🤗 초청자 이름</label>
        <input type="text" id="ddosimi-inv-name" placeholder="초청자 이름" maxlength="20">
      </div>
      <div class="form-group" style="flex:1;">
        <label>나이</label>
        <select id="ddosimi-inv-age" style="background:var(--bg);border:1px solid var(--border);border-radius:10px;color:var(--text);font-family:'Noto Sans KR',sans-serif;font-size:14px;padding:12px 14px;outline:none;width:100%;"></select>
      </div>
    </div>
    <div style="display:flex;gap:12px;">
      <div class="form-group" style="flex:1;">
        <label>💌 또심이 이름</label>
        <input type="text" id="ddosimi-ddo-name" placeholder="전도 대상자 이름" maxlength="20">
      </div>
      <div class="form-group" style="flex:1;">
        <label>나이</label>
        <select id="ddosimi-ddo-age" style="background:var(--bg);border:1px solid var(--border);border-radius:10px;color:var(--text);font-family:'Noto Sans KR',sans-serif;font-size:14px;padding:12px 14px;outline:none;width:100%;"></select>
      </div>
    </div>
    <div class="form-group">
      <label>기도제목</label>
      <textarea id="ddosimi-pray" placeholder="또심이를 위한 기도 제목을 적어주세요!" style="min-height:100px;"></textarea>
    </div>
    <div class="modal-actions" style="justify-content:space-between;">
      <button class="btn btn-danger" id="ddosimi-delete-btn" onclick="deleteDdosimi()" style="display:none;">🗑️ 삭제</button>
      <div style="display:flex;gap:10px;">
        <button class="btn btn-outline" onclick="closeDdosimiModal()">취소</button>
        <button class="btn btn-primary" onclick="saveDdosimi()">저장</button>
      </div>
    </div>
  </div>
</div>

<!-- 사람 추가/수정 모달 -->
<div class="modal-overlay" id="add-person-modal">
  <div class="modal">
    <h2 id="add-person-title">＋ 새 사람 추가</h2>
    <div class="form-group">
      <label>이름</label>
      <input type="text" id="new-person-name" placeholder="이름을 입력하세요">
    </div>
    <div class="form-group">
      <label>아이콘 선택</label>
      <div class="emoji-picker" id="emoji-picker"></div>
    </div>
    <div class="modal-actions" style="justify-content:space-between;">
      <button class="btn btn-danger" id="add-person-delete-btn" onclick="deletePerson()" style="display:none;">🗑️ 삭제</button>
      <div style="display:flex;gap:10px;">
        <button class="btn btn-outline" onclick="closeAddPersonModal()">취소</button>
        <button class="btn btn-primary" id="add-person-save-btn" onclick="savePerson()">추가</button>
      </div>
    </div>
  </div>
</div>

<!-- 요일 작정 선택 모달 -->
<div class="modal-overlay" id="pledge-modal">
  <div class="modal">
    <h2>📅 작정 기도 요일 선택</h2>
    <p style="font-size:13px;color:var(--text-muted);line-height:1.7;margin-bottom:4px;">
      매주 기도할 요일을 선택해주세요.<br>
      일요일마다 자동으로 초기화됩니다.
    </p>
    <div class="pledge-day-grid">
      <button class="pledge-day-btn" onclick="selectPledgeDay('월',this)">월</button>
      <button class="pledge-day-btn" onclick="selectPledgeDay('화',this)">화</button>
      <button class="pledge-day-btn" onclick="selectPledgeDay('수',this)">수</button>
      <button class="pledge-day-btn" onclick="selectPledgeDay('목',this)">목</button>
      <button class="pledge-day-btn" onclick="selectPledgeDay('금',this)">금</button>
      <button class="pledge-day-btn" onclick="selectPledgeDay('토',this)">토</button>
    </div>
    <button id="pledge-confirm-btn" disabled onclick="confirmPledge()">요일을 선택해주세요</button>
    <button class="pledge-skip-btn" onclick="closePledgeModal()">나중에 설정하기</button>
  </div>
</div>

<!-- ✨ 알림 스크립트 추가 -->
<script type="module" src="notifications.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
